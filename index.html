<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線框版網頁</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: sans-serif;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            border: 1px solid #000;
        }
        .header, .nav, .footer {
            border-bottom: 1px solid #000;
            padding: 20px;
            font-size: 24px;
        }
        .footer {
            border-bottom: none;
            border-top: 1px solid #000;
        }
        .main-content {
            display: flex;
            min-height: 400px;
        }
        .content {
            flex: 7; /* 佔比 7 */
            padding: 20px;
            font-size: 24px;
            border-right: 1px solid #000;
        }
        .sidebar {
            flex: 3; /* 佔比 3 */
            padding: 20px;
            font-size: 24px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            頁首
        </div>
        <div class="nav">
            導覽列
        </div>
        <div class="main-content">
            <div class="content">
                主要內容
            </div>
            <div class="sidebar">
                側邊欄
            </div>
        </div>
        <div class="footer">
            頁尾
        </div>
    </div>

</body>
</html>
